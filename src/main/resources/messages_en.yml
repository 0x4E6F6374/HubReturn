# & starts a legacy colour code; {xxx} is a placeholder. Missing keys fall back to the language.default file.
prefix: "&8[&aHub&8] &r"

command:
  success: "{prefix}&aSending you to &f{server}"
  failed: "{prefix}&cNo lobby is available right now."
  failed-detail: "{prefix}&cTransfer failed: &7{reason}"
  already-there: "{prefix}&7You are already in a lobby."
  cooldown: "{prefix}&7Too fast, try again in {seconds} seconds."
  no-permission: "{prefix}&cNo permission."
  console-only: "{prefix}&cThis command can only be run by a player."
  reloaded: "{prefix}&aConfiguration reloaded."
  reload-failed: "{prefix}&cReload failed: &7{error}"

confirm:
  prompt-repeat: "{prefix}&7Run &f{command} &7again to confirm, {seconds} seconds left."
  prompt-subcommand: "{prefix}&7Run &f{command} {confirm} &7to confirm or &f{command} {cancel} &7to cancel, {seconds} seconds left."
  prompt-chat: "{prefix}&7Type &f{keyword} &7in chat to confirm or &f{cancel-keyword} &7to cancel, {seconds} seconds left."
  prompt-click: "{prefix}&7Click {button} to confirm, {seconds} seconds left."
  pending: "{prefix}&7A request is already waiting, {seconds} seconds left."
  no-pending: "{prefix}&7No request is waiting."
  expired: "{prefix}&7Confirmation timed out, please try again."
  cancelled: "{prefix}&7Return cancelled."
  chat-echo: "&7(confirmed)"
  busy: "{prefix}&7Another return request is in progress, try again later."
  busy-reason: "Another request is in progress"
  reload-cancelled: "{prefix}&7Configuration reloaded, your request was cancelled."
  reload-reason: "Configuration reloaded, request cancelled"
  pending-reason: "A request is already waiting"
  cancel-reason: "Player cancelled the confirmation"
  timeout-reason: "Confirmation timed out"
  not-arrived: "Arrival at {server} could not be confirmed"

kick:
  redirected: "{prefix}&7Brought back from &f{server}&7."

log:
  loaded: "Loaded {lobbies} lobbies, strategy {strategy}, platform {platform}"
  channel: "Channel {channel} registered"
  no-lobbies: "No lobby servers configured, all return features will fail"
  bad-channel: "Channel {channel} registration failed: {error}"
  kick-dropped: "Player {player} was kicked from {server}, not taken over"
  kick-redirected: "Player {player} was kicked from {server}, redirected to {lobby}"
  drop-channel: "Dropped message: channel mismatch ({source})"
  drop-player-source: "Dropped message: client sent directly ({source})"
  drop-source-server: "Dropped message: source server not allowed ({source})"
  drop-frame: "Dropped message: bad payload ({source})"
  drop-action: "Dropped message: action mismatch ({source})"
  drop-offline: "Dropped message: target player offline ({player})"
  drop-cooldown: "Dropped message: player {player} is in cooldown"
  drop-no-lobby: "Dropped message: no lobby available ({player})"
  confirm-permission: "Player {player} no longer has permission, request dropped"
  confirm-timeout: "Player {player} transfer confirmation timed out"
  confirm-cancelled: "Player {player} cancelled the transfer confirmation"
  confirm-offline: "Player {player} is offline at confirmation, request dropped"
  delivery-timeout: "Delivery confirmation for {player} to {server} timed out"
  reload: "Configuration reloaded"
  reload-failed: "Reload failed: {error}"
